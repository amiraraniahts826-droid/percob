<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container login-page">
        <h1>Welcome Back User!</h1>
        <p class="subtitle">Login to continue</p>

        <form class="login-form login-form-page">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email">
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password">
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="or-text login-or">or login with</p>

        <div class="social-login login-social">
            <button type="button" class="social-btn">
                 <img src="asset/google.png" alt="Google" class="social-icon">
                <span>Google</span>
            </button>

            <button type="button" class="social-btn">
                <img src="asset/apple.png" alt="Apple" class="social-icon apple-icon"></span>
                <span>Apple</span>
            </button>
        </div>

        <p class="login-link signup-link">
            Don't have an account? <a href="index.html">Sign in</a>
        </p>
    </main>

</body>
</html>
